# High-Performance Production Nginx Configuration for Royal Safari Tours
# Place at /etc/nginx/sites-available/royalsafari.tours

server {
    listen 80;
    listen [::]:80;
    server_name www.royalsafari.tours royalsafari.tours;

    # Maximum upload size for high-res photos and documents (20MB)
    client_max_body_size 20M;

    # 1. High-Performance Zero-Copy Static Media Serving (Bypasses Node/Next runtimes)
    location /uploads/ {
        alias /var/www/royal-safari-media/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 2. Legacy Uploads Proxy Route (Backward Compatibility)
    location /api/uploads/ {
        rewrite ^/api/uploads/(.*)$ /uploads/$1 last;
    }

    # 3. Express Backend REST API Proxy
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Next.js App Router Proxy
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
